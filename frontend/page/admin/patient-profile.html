<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <!-- Link Css -->
    <link rel="stylesheet" href="../../style/style.css">
    <link rel="stylesheet" href="../../style/admin.css">
    <title>Patient Profile - Harmony Smiles</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="admin-body">
    <!-- HEADER -->
    <header class="admin-header d-flex align-items-center justify-content-between">
        <a href="../../page/admin/dashboard.html">
            <img class="logo" src="../../assets/img/logoclinicadental.png" alt="Harmony Smiles logo" loading="lazy">
        </a>
        <h1 class="h4 mb-0">Patient Profile</h1>
        <button id="logoutBtn" class="btn btn-outline-secondary">
            <i class="fas fa-right-from-bracket me-2"></i>Log Out
        </button>
    </header>

    <div class="admin-layout">
        <!-- SIDEBAR -->
        <nav class="admin-sidebar">
            <a href="dashboard.html" class="admin-sidebar-link" title="Appointments">
                <i class="fas fa-calendar-check"></i>
                <span>Appointments</span>
            </a>
            <a href="patients.html" class="admin-sidebar-link active" title="Patients">
                <i class="fas fa-user-group"></i>
                <span>Patients</span>
            </a>
        </nav>

        <!-- MAIN -->
        <main class="admin-main container-fluid py-4">
            <a href="patients.html" class="d-inline-block mb-3"><i class="fas fa-arrow-left me-2"></i>Back to Patients</a>

            <div id="profileError" class="alert alert-danger d-none" role="alert"></div>

            <div id="profileContent" class="d-none">
                <!-- PATIENT INFO CARD -->
                <div class="booking-card mb-4">
                    <div class="d-flex flex-wrap justify-content-between align-items-start mb-3">
                        <h2 id="patientName" class="fw-bold mb-0"></h2>
                        <span id="patientMrn" class="badge bg-secondary fs-6"></span>
                    </div>
                    <div class="row g-3">
                        <div class="col-6 col-md-3">
                            <div class="text-muted small">Phone</div>
                            <div id="patientPhone" class="fw-semibold"></div>
                        </div>
                        <div class="col-6 col-md-3">
                            <div class="text-muted small">Email</div>
                            <div id="patientEmail" class="fw-semibold"></div>
                        </div>
                        <div class="col-6 col-md-2">
                            <div class="text-muted small">Age</div>
                            <div id="patientAge" class="fw-semibold"></div>
                        </div>
                        <div class="col-6 col-md-2">
                            <div class="text-muted small">Gender</div>
                            <div id="patientGender" class="fw-semibold"></div>
                        </div>
                        <div class="col-6 col-md-2">
                            <div class="text-muted small">Registered</div>
                            <div id="patientRegistered" class="fw-semibold"></div>
                        </div>
                    </div>
                </div>

                <!-- UPCOMING APPOINTMENTS -->
                <h5 class="fw-semibold mb-3">Next Appointments</h5>
                <div class="table-responsive mb-4">
                    <table class="table table-hover align-middle admin-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Visit Reason</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="upcomingAppointmentsBody"></tbody>
                    </table>
                </div>

                <!-- APPOINTMENT HISTORY -->
                <h5 class="fw-semibold mb-3">Appointment History</h5>
                <div class="table-responsive mb-4">
                    <table class="table table-hover align-middle admin-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Time</th>
                                <th>Visit Reason</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="pastAppointmentsBody"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="./admin-api.js"></script>
    <script src="./admin-common.js"></script>
    <script src="./patient-profile.js"></script>
</body>

</html>
