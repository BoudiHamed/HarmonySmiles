<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <!-- Link Css -->
    <link rel="stylesheet" href="../../style/style.css">
    <link rel="stylesheet" href="../../style/admin.css">
    <title>Patients - Harmony Smiles</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="admin-body">
    <!-- HEADER -->
    <header class="admin-header d-flex align-items-center justify-content-between">
        <a href="../../index.html">
            <img class="logo" src="../../assets/img/logoclinicadental.png" alt="Harmony Smiles logo" loading="lazy">
        </a>
        <h1 class="h4 mb-0">Patients</h1>
        <button id="logoutBtn" class="btn btn-outline-secondary">
            <i class="fas fa-right-from-bracket me-2"></i>Log Out
        </button>
    </header>

    <div class="admin-layout">
        <!-- SIDEBAR -->
        <nav class="admin-sidebar">
            <a href="dashboard.html" class="admin-sidebar-link" title="Appointments">
                <i class="fas fa-calendar-check"></i>
                <span>Appointments</span>
            </a>
            <a href="patients.html" class="admin-sidebar-link active" title="Patients">
                <i class="fas fa-user-group"></i>
                <span>Patients</span>
            </a>
        </nav>

        <!-- MAIN -->
        <main class="admin-main container-fluid py-4">
            <div id="dashboardError" class="alert alert-danger d-none" role="alert"></div>

            <!-- PATIENT FILTERS -->
            <form id="patientFilterForm" class="row g-3 align-items-end mb-4">
                <div class="col-12 col-md-4">
                    <label for="patientSearchFilter" class="form-label">Search (name, phone, or MRN)</label>
                    <input type="text" id="patientSearchFilter" class="form-control" placeholder="e.g. Doe or HS-2026-0001">
                </div>
                <div class="col-auto">
                    <button type="submit" class="btn btn-sh-admin">Apply</button>
                </div>
                <div class="col-auto">
                    <button type="button" id="clearPatientFiltersBtn" class="btn btn-outline-secondary">Clear</button>
                </div>
            </form>

            <!-- PATIENTS TABLE -->
            <div class="table-responsive">
                <table class="table table-hover align-middle admin-table">
                    <thead>
                        <tr>
                            <th>MRN</th>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Registered</th>
                        </tr>
                    </thead>
                    <tbody id="patientsBody">
                        <tr>
                            <td colspan="7" class="text-center text-muted py-4">Loading patients…</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="./admin-api.js"></script>
    <script src="./patients.js"></script>
</body>

</html>
