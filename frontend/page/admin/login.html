<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Link Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <!-- Link Css -->
    <link rel="stylesheet" href="../../style/style.css">
    <link rel="stylesheet" href="../../style/admin.css">
    <title>Admin Login - Harmony Smiles</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body class="admin-body">
    <main class="admin-login-main d-flex align-items-center justify-content-center">
        <div class="admin-login-card">
            <a href="../../index.html" class="d-block text-center mb-4">
                <img class="logo" src="../../assets/img/logoclinicadental.png" alt="Harmony Smiles logo" loading="lazy">
            </a>
            <h1 class="h4 text-center mb-4">Admin Login</h1>
            <div id="loginError" class="alert alert-danger d-none" role="alert"></div>
            <form id="loginForm" novalidate>
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" required autocomplete="username">
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-sh-admin w-100">
                    <i class="fas fa-right-to-bracket me-2"></i>Log In
                </button>
            </form>
        </div>
    </main>
    <!-- JS Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
    <script src="./admin-api.js"></script>
    <script src="./login.js"></script>
</body>

</html>
